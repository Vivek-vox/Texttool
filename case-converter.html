      <h1>Case Converter</h1>
      <p>Pick a format, then type or paste your text. The result appears instantly on the right.</p>

      <button class="case-btn active" data-case="upper">UPPERCASE</button>

          <button class="btn" id="clearBtn">Clear</button>
        </div>
      </div>
      <div class="panel">
        <span class="panel-label">Output</span>
        <textarea id="outputText" readonly placeholder="Converted text will appear here…"></textarea>

          <button class="btn" id="copyBtn">Copy</button>

    <script>
    let activeCase='upper';
    const fns={
      upper:t=>t.toUpperCase(),
      lower:t=>t.toLowerCase(),
      title:t=>t.replace(/\w\S*/g,w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()),
      sentence:t=>t.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g,c=>c.toUpperCase())
    };
    const input=document.getElementById('inputText'),output=document.getElementById('outputText');
    function convert(){output.value=input.value?fns[activeCase](input.value):'';}
    document.querySelectorAll('.case-btn').forEach(btn=>{
      btn.addEventListener('click',function(){
        document.querySelectorAll('.case-btn').forEach(b=>b.classList.remove('active'));
        this.classList.add('active');
        activeCase=this.dataset.case;
        convert();
      });
    });
    input.addEventListener('input',convert);
    document.getElementById('clearBtn').addEventListener('click',()=>{input.value='';output.value='';input.focus();});
    document.getElementById('copyBtn').addEventListener('click',function(){
      if(!output.value)return;
      navigator.clipboard.writeText(output.value).then(()=>{
        this.textContent='Copied!';this.classList.add('copied');
        setTimeout(()=>{this.textContent='Copy';this.classList.remove('copied');},1800);
      }).catch(()=>{});
    });
    const y=new Date().getFullYear();
    const s=document.getElementById('copyright');
    if(s)s.textContent=y>2026?'© 2026–'+y+' TextTools':'© 2026 TextTools';
  </script>
